name: gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint the gate modules
        run: ruff check src/eval tests/test_asof_audit.py tests/test_gates.py tests/test_opening_odds.py tests/test_holdout.py tests/test_procedure.py tests/test_provenance.py
      - name: Gate tests
        run: python -m unittest tests.test_asof_audit tests.test_gates tests.test_opening_odds tests.test_holdout tests.test_procedure tests.test_provenance tests.test_fpl_2026_rules
