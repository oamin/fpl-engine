name: capture

on:
  schedule:
    # Every 15 minutes. The windows are several hours wide; a late hourly run
    # used to be able to miss the hour before the deadline.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Capture when the deadline is inside the window
        run: python -m src.eval.capture_schedule
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions
          if git diff --cached --quiet; then
            echo "no new capture"
          else
            git commit -m "Capture the FPL bootstrap before the deadline"
            git push
          fi
      - name: Open an issue when the capture fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "FPL capture failed";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 30,
            });
            const already = existing.data.find((issue) => issue.title === title);
            if (already) return;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: `The scheduled capture failed: ${run}\n\nA gameweek with no snapshot delays the 20-week test. This issue is opened once and left open until someone closes it.`,
            });
