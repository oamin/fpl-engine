name: capture

on:
  schedule:
    # Every 15 minutes. The windows are several hours wide; a late hourly run
    # used to be able to miss the hour before the deadline.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live writes a slot. scratch and fail write outside the decision path."
        required: true
        default: live
        type: choice
        options:
          - live
          - scratch
          - fail

# Overlapping runs queue. A second run must not cancel the one that is pushing.
concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Capture when the deadline is inside the window
        env:
          # The capture does not call the Odds API. An empty secret stays empty.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "scratch" ]; then
            python -m src.eval.capture_schedule --scratch data/scratch/capture --force
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "fail" ]; then
            python -m src.eval.capture_schedule --scratch data/scratch/capture --force --fail-after-write
          else
            python -m src.eval.capture_schedule
          fi
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions data/scratch
          if git diff --cached --quiet; then
            echo "no new capture"
          else
            git commit -m "Capture the FPL bootstrap before the deadline"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Open an issue when the capture fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "FPL capture failed";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 30,
            });
            const already = existing.data.find((issue) => issue.title === title);
            if (already) return;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: `The scheduled capture failed: ${run}\n\nA gameweek with no snapshot delays the 20-week test. This issue is opened once and left open until someone closes it.`,
            });
