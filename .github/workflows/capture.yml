name: capture

on:
  schedule:
    # Every 15 minutes. The windows are several hours wide; a late hourly run
    # used to be able to miss the hour before the deadline.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Capture when the deadline is inside the window
        run: python -m src.eval.capture_schedule
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions
          if git diff --cached --quiet; then
            echo "no new capture"
          else
            git commit -m "Capture the FPL bootstrap before the deadline"
            git push
          fi
