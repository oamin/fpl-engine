[project]
name = "fpl-engine"
version = "1.0.0"
description = "FPL points front-end: team pot × share → baseline/residual → μ"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "lightgbm>=4.0",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pulp>=4.0.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
]

[project.scripts]
fpl-frontend = "src.run_frontend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
